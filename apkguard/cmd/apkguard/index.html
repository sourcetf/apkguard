<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>apkguard · APK 加固工作台</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--fg:#e6e9ef;
        --dim:#9aa3b2;--accent:#4f8cff;--ok:#38d39f;--warn:#ffb454;--err:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  header{display:flex;align-items:baseline;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.5px}
  header .sub{color:var(--dim);font-size:12.5px}
  header .spacer{flex:1}
  .pill{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
  main{display:grid;grid-template-columns:minmax(420px,1fr) minmax(380px,1fr);gap:16px;padding:16px 22px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
  .card h2{margin:0 0 10px;font-size:14px;font-weight:600}
  .card h2 .hint{font-weight:400;color:var(--dim);font-size:12px;margin-left:6px}
  .presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:6px 12px;transition:.15s}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:11px 20px;width:100%;font-size:15px}
  button.primary:disabled{opacity:.5;cursor:default}
  .group{margin-bottom:10px}
  .group>.gname{color:var(--dim);font-size:12px;margin:8px 0 4px}
  .feat{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start;padding:4px 6px;border-radius:6px}
  .feat:hover{background:var(--panel2)}
  .feat input{margin-top:4px}
  .feat .fname{font-weight:500}
  .feat .fid{color:var(--dim);font-size:12px;margin-left:6px}
  .feat .fdesc{color:var(--dim);font-size:12px;display:block}
  .feat.danger .fname::after{content:"危险区";margin-left:6px;color:var(--err);font-size:11px}
  .feat.locked{opacity:.55}
  .feat.locked .fname::after{content:"未实现";margin-left:6px;color:var(--warn);font-size:11px}
  label.row{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:center;margin:7px 0}
  label.row>span{color:var(--dim);font-size:12.5px}
  input[type=text],input[type=password],input[type=number]{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  details summary{cursor:pointer;color:var(--dim);font-size:12.5px;margin:8px 0}
  #status{margin-top:12px;min-height:22px;font-size:13px}
  #status .spin{display:inline-block;width:12px;height:12px;margin-right:8px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ok{color:var(--ok)} .err{color:var(--err)} .dim{color:var(--dim)}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:320px;overflow:auto;font-size:12.5px;white-space:pre-wrap}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  td.k{color:var(--dim);white-space:nowrap;width:40%}
  .out{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--panel2);border:1px dashed var(--line);font-size:12.5px;word-break:break-all}
</style>
</head>
<body>
<header>
  <h1>apkguard</h1><span class="sub">纯 Go APK 加固工作台</span>
  <span class="spacer"></span><span class="pill" id="cnt">加载中…</span>
</header>
<main>
  <div>
    <div class="card">
      <h2>功能项<span class="hint">未实现的项已禁用</span></h2>
      <div class="presets">
        <button id="p-rec">推荐配置</button>
        <button id="p-min">仅混淆</button>
        <button id="p-shell">加壳链路</button>
        <button id="p-all">全部（不含危险区）</button>
        <button id="p-none">全不选</button>
      </div>
      <div id="features"></div>
    </div>
  </div>
  <div>
    <div class="card">
      <h2>输入与输出</h2>
      <label class="row"><span>待加固 APK</span><input type="text" id="in" placeholder="C:\path\to\app.apk"></label>
      <label class="row"><span>输出路径</span><input type="text" id="out" placeholder="留空 = 输入名-protected.apk"></label>
      <label class="row"><span>随机种子</span><input type="text" id="seed" placeholder="留空每次随机；填固定值可复现"></label>
    </div>
    <div class="card">
      <h2>签名<span class="hint">启用 E1 时必填</span></h2>
      <label class="row"><span>密钥库</span><input type="text" id="ks" placeholder="C:\path\to\release.jks"></label>
      <label class="row"><span>库口令</span><input type="password" id="ks_pass"></label>
      <label class="row"><span>私钥口令</span><input type="password" id="key_pass" placeholder="默认同库口令"></label>
      <label class="row"><span>类型</span><input type="text" id="ks_type" placeholder="jks / pkcs12，留空自动探测"></label>
      <label class="row"><span>别名</span><input type="text" id="alias" placeholder="留空取第一个私钥条目"></label>
    </div>
    <div class="card">
      <h2>高级<span class="hint">数值框已预填 CLI 默认值，勾选即生效</span></h2>
      <details open><summary>签名 / SDK / 并发</summary>
        <label class="row"><span>禁用 v1</span><input type="checkbox" id="no_v1"></label>
        <label class="row"><span>禁用 v2</span><input type="checkbox" id="no_v2"></label>
        <label class="row"><span>禁用 v3</span><input type="checkbox" id="no_v3"></label>
        <label class="row"><span>额外 v4</span><input type="checkbox" id="v4"></label>
        <label class="row"><span>minSdk</span><input type="number" id="min_sdk" value="24"></label>
        <label class="row"><span>maxSdk</span><input type="number" id="max_sdk" value="2147483647"></label>
        <label class="row"><span>并发数</span><input type="number" id="jobs" value="0" placeholder="0 = CPU 核数（E5）"></label>
      </details>
      <details><summary>渠道 / 设备绑定 / 签名指纹</summary>
        <label class="row"><span>渠道列表</span><input type="text" id="channels" placeholder="huawei,xiaomi（E4）"></label>
        <label class="row"><span>设备绑定</span><input type="text" id="bind_device" placeholder="android_id（D5）"></label>
        <label class="row"><span>签名指纹</span><input type="text" id="sig_hash" placeholder="SHA-256 十六进制（D1）"></label>
      </details>
      <details><summary>混淆与膨胀参数</summary>
        <label class="row"><span>名称前缀</span><input type="text" id="name_prefix" placeholder="A1 混淆类名前缀"></label>
        <label class="row"><span>压缩包名</span><input type="checkbox" id="package_shrink"></label>
        <label class="row"><span>保留白名单</span><input type="text" id="keep_rules" placeholder="A1 规则文件路径（每行一条）"></label>
        <label class="row"><span>R 类改名</span><input type="checkbox" id="rename_resource_ids" checked title="A1 把 aapt 生成的资源 ID 类（R/R$Type）与字段一起改名，static_values 中的资源 ID 常量保持原样（对齐参考样本）。默认开启，取消勾选即 -rename-resource-ids=false；应急可用环境变量 APKGUARD_KEEP_RCLASS_IDS=1 强制关闭。"></label>
        <label class="row"><span>最短加密</span><input type="number" id="obf_string_min" value="0" placeholder="0 = 全部（A2）"></label>
        <label class="row"><span>仅单引用串</span><input type="checkbox" id="obf_string_single_ref" title="A2 只加密恰好被 1 条 const-string 引用的字符串。会降低保护强度：多引用串将留明文，仅为让加密分布更像参考样本，不建议常规使用。"></label>
        <label class="row"><span>垃圾顶文件</span><input type="number" id="junk_top_count" value="800" placeholder="800（A10）"></label>
        <label class="row"><span>垃圾深目录</span><input type="number" id="junk_dir_count" value="400" placeholder="400（A10）"></label>
        <label class="row"><span>深目录层数</span><input type="number" id="junk_dir_depth" value="16" placeholder="16（A10）"></label>
        <label class="row"><span>畸形 META</span><input type="number" id="junk_meta_count" value="20" placeholder="20（A10）"></label>
        <label class="row"><span>伪 DEX 块数</span><input type="number" id="fake_dex_count" value="1" placeholder="1（A9）"></label>
        <label class="row"><span>伪 DEX 块大小</span><input type="number" id="fake_dex_size" value="80000" placeholder="80000（A9）"></label>
        <label class="row"><span>ZIP 攻击条数</span><input type="number" id="zip_atk_count" value="150" placeholder="150（A12）"></label>
        <label class="row"><span>类膨胀数</span><input type="number" id="class_pad_count" value="100" placeholder="100（A13）"></label>
        <label class="row"><span>时间戳</span><input type="text" id="stamp_time" placeholder="2024-01-01T00:00:00Z（A14）"></label>
        <label class="row"><span>Manifest 填充</span><input type="number" id="manifest_pad_mb" value="0" placeholder="0=默认100MB，上限1024（A15，危险区）"></label>
        <label class="row"><span>诱饵核心组</span><input type="number" id="decoy_core_count" value="0" placeholder="0=默认（A16）"></label>
        <label class="row"><span>诱饵 APK MB</span><input type="number" id="decoy_apk_mb" value="0" placeholder="0=默认（A17）"></label>
        <label class="row"><span>诱饵元数据</span><input type="number" id="decoy_meta_count" value="0" placeholder="0=默认（A18）"></label>
        <label class="row"><span>垃圾字符串</span><input type="number" id="str_junk_count" value="0" placeholder="0=默认（A19）"></label>
        <label class="row"><span>花指令组数</span><input type="number" id="junk_insn_count" value="0" placeholder="0=默认（A20）"></label>
        <label class="row"><span>return 前 nop</span><input type="checkbox" id="return_nops" checked title="A20 在每条 return 之前插入 1 条 nop（参考样本形态：全部单发、无连续段）。启用 A20 时默认开启，取消勾选即 -return-nops=false。"></label>
      </details>
      <details><summary>加壳 / Native 参数</summary>
        <label class="row"><span>DEX 密钥</span><input type="text" id="dex_key" placeholder="B1 加密密钥（留空自动生成）"></label>
        <label class="row"><span>诱饵假包名</span><input type="text" id="decoy_pkg" placeholder="dummy.installed.check（B8）"></label>
        <label class="row"><span>载荷 MAC</span><input type="checkbox" id="payload_mac"></label>
        <label class="row"><span>SO 加密</span><input type="checkbox" id="so_encrypt"></label>
        <label class="row"><span>壳包名</span><input type="text" id="shell_pkg" value="com.apkguard.shell"></label>
        <label class="row"><span>拆分份数</span><input type="number" id="split_count" value="0" placeholder="0 = 不拆（B4）"></label>
        <label class="row"><span>抽取比例</span><input type="number" id="extract_ratio" value="0" placeholder="B5 未实现，须为 0"></label>
        <label class="row"><span>排障壳</span><input type="checkbox" id="debug_shell"></label>
        <label class="row"><span>假库名</span><input type="text" id="lib_fake_name" placeholder="libsqlite3x.so（C7）"></label>
        <label class="row"><span>清 ELF 节头</span><input type="checkbox" id="lib_strip_sections"></label>
        <label class="row"><span>本地头假加密</span><input type="checkbox" id="zip_local_decoy" title="仅对 AndroidManifest.xml/classes*.dex/resources.arsc 在本地头写 bit0+bit6，中央目录不变。参考样本同款手法（样本在 Android 16 实测可安装），但本工具产物尚未真机验证，默认关闭。"></label>
      </details>
    </div>
    <div class="card">
      <h2>执行</h2>
      <button class="primary" id="run">开始加固</button>
      <div id="status"></div>
      <div id="result"></div>
    </div>
  </div>
</main>
<script>
const state = {features: [], enabled: {}};
async function loadFeatures() {
  const d = await (await fetch('/api/features')).json();
  const box = document.getElementById('features');
  box.innerHTML = ''; state.features = [];
  for (const g of d.groups) {
    const gd = document.createElement('div');
    gd.className = 'group';
    gd.innerHTML = '<div class="gname">' + g.name + '</div>';
    for (const f of g.features) {
      state.features.push(f);
      const row = document.createElement('label');
      row.className = 'feat' + (f.implemented ? '' : ' locked') + (f.risk === '危险区' ? ' danger' : '');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.disabled = !f.implemented;
      cb.checked = !!f.default && !!f.implemented;
      cb.dataset.id = f.id;
      cb.addEventListener('change', function(){ state.enabled[f.id] = cb.checked; });
      state.enabled[f.id] = cb.checked;
      const t = document.createElement('div');
      t.innerHTML = '<span class="fname">' + f.name + '</span><span class="fid">' + f.id +
                    '</span><span class="fdesc">' + (f.desc || '') + '</span>';
      row.appendChild(cb); row.appendChild(t); gd.appendChild(row);
    }
    box.appendChild(gd);
  }
  document.getElementById('cnt').textContent = '共 ' + d.total + ' 项';
}
function setPreset(ids) {
  for (const f of state.features) {
    const cb = document.querySelector('input[data-id="' + f.id + '"]');
    if (!cb) continue;
    const on = ids === null ? (!!f.implemented && f.risk !== '危险区') : ids.indexOf(f.id) >= 0;
    cb.checked = on && !!f.implemented;
    state.enabled[f.id] = cb.checked;
  }
}
const PRESETS = {
  rec: ['A1','A2','A3','A4','B1','B2','B3','E1','E2','E3','E6'],
  min: ['A1','A2','A3','A4','E1','E2','E3','E6'],
  shell: ['A1','A2','A3','A4','B1','B2','B3','B4','E1','E2','E3','E6']
};
function val(id) { const el = document.getElementById(id); return el ? (el.value || '').trim() : ''; }
function checked(id) { const el = document.getElementById(id); return !!(el && el.checked); }
// num 在输入框留空时回退到 def，保证「清空输入框」不会退化成 0 = 空操作。
// def 必须与 cmd/apkguard/main.go 里对应 flag 的默认值一致。
function num(id, def) {
  const v = val(id);
  if (v === '') return def;
  const n = Number(v);
  return isNaN(n) ? def : n;
}
// channels 必须按逗号切成数组：后端的 Options.Channels 是 []string，
// 直接发字符串会让 json.Decode 报 "cannot unmarshal string into ... []string"，
// 导致界面上任何一次「开始加固」都失败。
function channels() {
  const v = val('channels');
  if (!v) return undefined;
  const out = v.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
  return out.length ? out : undefined;
}
// collect() 的键必须与 config.Options 的全部 JSON tag 一一对应。
// 缺键会让对应功能项在 Web 路径下拿到 Go 零值（数值项为 0 即空操作），
// cmd/apkguard/auditfix_web_test.go 会断言这份集合完全相等。
function collect() {
  const enabled = {};
  for (const f of state.features) enabled[f.id] = !!state.enabled[f.id];
  return {
    enabled: enabled,
    in: val('in'),
    out: val('out'),
    ks: val('ks'),
    ks_pass: val('ks_pass'),
    key_pass: val('key_pass'),
    ks_type: val('ks_type'),
    alias: val('alias'),
    no_v1: checked('no_v1'),
    no_v2: checked('no_v2'),
    no_v3: checked('no_v3'),
    v4: checked('v4'),
    min_sdk: num('min_sdk', 24),
    max_sdk: num('max_sdk', 2147483647),
    name_prefix: val('name_prefix'),
    package_shrink: checked('package_shrink'),
    keep_rules: val('keep_rules'),
    rename_resource_ids: checked('rename_resource_ids'),
    obf_string_min: num('obf_string_min', 0),
    obf_string_single_ref: checked('obf_string_single_ref'),
    seed: val('seed'),
    fake_dex_count: num('fake_dex_count', 1),
    fake_dex_size: num('fake_dex_size', 80000),
    junk_top_count: num('junk_top_count', 800),
    junk_dir_count: num('junk_dir_count', 400),
    junk_dir_depth: num('junk_dir_depth', 16),
    junk_meta_count: num('junk_meta_count', 20),
    zip_atk_count: num('zip_atk_count', 150),
    class_pad_count: num('class_pad_count', 100),
    stamp_time: val('stamp_time'),
    manifest_pad_mb: num('manifest_pad_mb', 0),
    decoy_core_count: num('decoy_core_count', 0),
    decoy_apk_mb: num('decoy_apk_mb', 0),
    decoy_meta_count: num('decoy_meta_count', 0),
    str_junk_count: num('str_junk_count', 0),
    junk_insn_count: num('junk_insn_count', 0),
    return_nops: checked('return_nops'),
    lib_fake_name: val('lib_fake_name'),
    lib_strip_sections: checked('lib_strip_sections'),
    zip_local_decoy: checked('zip_local_decoy'),
    dex_key: val('dex_key'),
    decoy_pkg: val('decoy_pkg'),
    payload_mac: checked('payload_mac'),
    so_encrypt: checked('so_encrypt'),
    shell_pkg: val('shell_pkg'),
    split_count: num('split_count', 0),
    extract_ratio: num('extract_ratio', 0),
    debug_shell: checked('debug_shell'),
    sig_hashes: val('sig_hash') ? [val('sig_hash')] : undefined,
    bind_device: val('bind_device'),
    channels: channels(),
    jobs: num('jobs', 0)
  };
}
// status / busy 一律用 textContent 写文本，绝不拼 innerHTML：
// 错误信息、输出路径、notes/stats 都可能来自用户输入或 APK 内容（条目名/组件名），
// 直接 innerHTML 会形成自 XSS 与注入面。
function status(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = '';
  if (cls) {
    const s = document.createElement('span');
    s.className = cls;
    s.textContent = msg;
    el.appendChild(s);
  } else {
    el.textContent = msg;
  }
}
function busy(msg) {
  const el = document.getElementById('status');
  el.textContent = '';
  const sp = document.createElement('span');
  sp.className = 'spin';
  el.appendChild(sp);
  el.appendChild(document.createTextNode(msg));
}
async function run() {
  // 危险区二次确认：启用这些功能项可能破坏兼容性或显著增大体积，
  // 提交前必须让用户看清并显式确认。用户取消则不提交。
  const danger = state.features.filter(function(f){
    return state.enabled[f.id] && f.risk === '危险区';
  }).map(function(f){ return '  ' + f.id + ' ' + f.name; });
  if (danger.length && !confirm('已勾选以下危险区功能项，可能破坏兼容性或显著增大体积：\n\n'
      + danger.join('\n') + '\n\n确认继续加固？')) {
    return;
  }
  const btn = document.getElementById('run');
  btn.disabled = true;
  const result = document.getElementById('result');
  result.textContent = '';
  busy('正在加固，大包可能需要几分钟…');
  const t0 = Date.now();
  try {
    const resp = await fetch('/api/run', {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(collect())});
    const d = await resp.json();
    const secs = ((Date.now() - t0) / 1000).toFixed(1);
    if (!d.ok) {
      status('加固失败（' + secs + 's）：' + (d.error || '未知错误'), 'err');
      return;
    }
    status('加固完成（' + (d.duration || secs + 's') + '）', 'ok');
    // 多渠道/批量时后端返回多个路径；单包时只有一个。
    const outs = (d.outs && d.outs.length) ? d.outs : [d.out];
    for (const o of outs) {
      const kb = (o === d.out && d.size) ? '（' + (d.size / 1024).toFixed(1) + ' KB）' : '';
      const div = document.createElement('div');
      div.className = 'out';
      div.textContent = '输出：' + o + kb;
      result.appendChild(div);
    }
    if (d.ran && d.ran.length) {
      const p = document.createElement('p');
      p.className = 'dim';
      p.textContent = '执行了 ' + d.ran.length + ' 项：' + d.ran.join(', ');
      result.appendChild(p);
    }
    if (d.notes && d.notes.length) {
      const pre = document.createElement('pre');
      pre.textContent = d.notes.join('\n');
      result.appendChild(pre);
    }
    const st = d.stats || {}, keys = Object.keys(st).sort();
    if (keys.length) {
      const table = document.createElement('table');
      for (const k of keys) {
        const tr = document.createElement('tr');
        const tdK = document.createElement('td');
        tdK.className = 'k';
        tdK.textContent = k;
        const tdV = document.createElement('td');
        tdV.textContent = st[k];
        tr.appendChild(tdK); tr.appendChild(tdV); table.appendChild(tr);
      }
      result.appendChild(table);
    }
  } catch (e) {
    status('请求失败：' + e, 'err');
  } finally { btn.disabled = false; }
}
document.getElementById('run').addEventListener('click', run);
document.getElementById('p-rec').addEventListener('click', function(){ setPreset(PRESETS.rec); });
document.getElementById('p-min').addEventListener('click', function(){ setPreset(PRESETS.min); });
document.getElementById('p-shell').addEventListener('click', function(){ setPreset(PRESETS.shell); });
document.getElementById('p-all').addEventListener('click', function(){ setPreset(null); });
document.getElementById('p-none').addEventListener('click', function(){ setPreset([]); });
loadFeatures();
</script>
